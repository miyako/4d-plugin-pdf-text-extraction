# Builds the plugin for Windows (x64) first, then macOS as a universal
# (arm64 + x86_64) binary, merges both into the single cross-platform
# .bundle, codesigns + notarizes the mac binary, and publishes a GitHub
# Release with the zip and dmg attached.
#
# Trigger: push a tag matching v*.*.* (either by hand, or via bump-version.yml).
# You can also run it manually against an existing tag with workflow_dispatch.

name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v2.3.0)
        required: true

permissions:
  contents: write

env:
  # ---- edit these per-project, everything else is generic ----
  PRODUCT_NAME: PDF Text Extraction
  XCODE_PROJECT: PDF Text Extraction.xcodeproj
  VCX_SOLUTION: PDF Text Extraction.sln
  MACOS_DEPLOYMENT_TARGET: '10.13'
  # --------------------------------------------------------------

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Builds Zlib/FreeType/LibAesgm/LibJpeg/LibTiff/LibPng/PDFWriter from
      # source instead of depending on hand-uploaded prebuilt binaries.
      # Pinned to tag 4.1 - confirmed byte-for-byte identical to the headers
      # already vendored under include/PDFWriter in this repo.
      #
      # PDF-Writer's own CMake defines two targets per dependency: a
      # "<Name>_OBJLIB" OBJECT library (compiles sources, produces no .lib -
      # this is CMake OBJECT-library semantics on every generator, verified
      # directly rather than assumed) and a plain "<Name>" STATIC library
      # that wraps it into a real archive. Building "PDFWriter" alone
      # cascades through and builds all 6 dependencies automatically via
      # target_link_libraries. We then rename each real output to the
      # "_OBJLIB" filename this project's own .vcxproj already expects,
      # since that's just this plugin's own packaging convention, not
      # anything PDF-Writer's build produces directly.
      - name: build PDFWriter static libraries from source
        shell: pwsh
        run: |
          git clone --branch 4.1 --depth 1 https://github.com/galkahana/PDF-Writer.git pdfwriter-src
          # No -G here: hardcoding "Visual Studio 17 2022" fails outright if
          # the runner ships a newer VS generation (confirmed: this runner's
          # actual compiler path is ...\Microsoft Visual Studio\18\..., not
          # \17\, so that generator name matches no installed instance).
          # Letting CMake auto-detect whatever VS is actually there and
          # pinning just the toolset mirrors how "build x64" below already
          # handles this same runner-version drift for MSBuild directly.
          # -DCMAKE_POLICY_VERSION_MINIMUM=3.5 (via preload-version.cmake below):
          # PDF-Writer's own CMakeLists.txt (and subdirectories) declare
          # cmake_minimum_required(VERSION 2.8.12). Modern CMake (this
          # runner's version, confirmed via the actual error text) hard-
          # errors on that instead of just warning - this is CMake's own
          # documented workaround for vendored projects we don't want to
          # edit, not a project-specific hack.
          #
          # CMAKE_POLICY_DEFAULT_CMP0091=NEW plus CMAKE_MSVC_RUNTIME_LIBRARY
          # (the modern, CMake-documented mechanism for forcing the static
          # CRT) was tried twice and produced the identical link error both
          # times. Reading CMake's own Windows-MSVC.cmake module directly
          # explains why: whether /MD gets baked into the flags at all is
          # decided by CMP0091's actual state at the moment enable_language()
          # runs (inside project()) - but a -C preload script runs BEFORE
          # project() is ever called, so CMAKE_CXX_FLAGS_RELEASE etc. were
          # still empty when my substitution code ran, and force-caching
          # them to empty likely suppressed the normal _INIT seeding
          # entirely. Two configure passes fixes this: pass 1 only sets the
          # policy-version-minimum and lets CMake populate its real (still
          # /MD) defaults normally; pass 2 reconfigures the now-existing
          # build tree and substitutes /MD for /MT in the now-populated
          # flag variables, which are guaranteed non-empty this time.
          @'
          set(CMAKE_POLICY_VERSION_MINIMUM 3.5 CACHE STRING "" FORCE)
          '@ | Set-Content -Path preload-version.cmake -Encoding utf8

          @'
          foreach(flag_var
              CMAKE_C_FLAGS CMAKE_C_FLAGS_DEBUG CMAKE_C_FLAGS_RELEASE
              CMAKE_C_FLAGS_MINSIZEREL CMAKE_C_FLAGS_RELWITHDEBINFO
              CMAKE_CXX_FLAGS CMAKE_CXX_FLAGS_DEBUG CMAKE_CXX_FLAGS_RELEASE
              CMAKE_CXX_FLAGS_MINSIZEREL CMAKE_CXX_FLAGS_RELWITHDEBINFO)
              if(${flag_var} MATCHES "/MD")
                  string(REGEX REPLACE "/MD" "/MT" ${flag_var} "${${flag_var}}")
                  set(${flag_var} "${${flag_var}}" CACHE STRING "" FORCE)
              endif()
          endforeach()
          '@ | Set-Content -Path fix-runtime.cmake -Encoding utf8

          cmake -A x64 -T v143 -C preload-version.cmake -S pdfwriter-src -B pdfwriter-build
          cmake -C fix-runtime.cmake pdfwriter-build
          cmake --build pdfwriter-build --target PDFWriter --config Release

          New-Item -ItemType Directory -Force -Path "lib\windows64" | Out-Null
          $libs = @("Zlib", "LibAesgm", "LibJpeg", "LibTiff", "FreeType", "LibPng", "PDFWriter")
          foreach ($lib in $libs) {
            $found = Get-ChildItem -Path pdfwriter-build -Recurse -Filter "$lib.lib" | Select-Object -First 1
            if (-not $found) {
              Write-Error "Build did not produce $lib.lib - see build output above."
              exit 1
            }
            $out = "lib\windows64\${lib}_OBJLIB.lib"
            Copy-Item $found.FullName $out -Force
            Write-Host "Copied $($found.FullName) -> $out"
          }

      # GitHub-hosted windows-latest ships VS2022 (v143 toolset) but not the
      # legacy v140 toolset the project is pinned to, so we override it on
      # the command line rather than requiring an extra VS component install.
      #
      # The project also hardcodes WindowsTargetPlatformVersion=8.1 in
      # TZ.vcxproj (<PropertyGroup Label="Globals">), and the Windows 8.1 SDK
      # is no longer installed on current windows-latest images, which fails
      # with MSB8036 ("The Windows SDK version 8.1 was not found"). Same class
      # of fix as the toolset override above: override it on the command line
      # rather than editing the vcxproj (which applies to all 4
      # Debug/Release x Win32/x64 configurations, not just the one this job
      # builds). "10.0" lets MSBuild resolve to whatever full 10.0.xxxxx.x SDK
      # is actually installed on the runner, rather than pinning an exact
      # build number that may not match the image.
      - name: build x64
        shell: cmd
        run: msbuild "${{ env.VCX_SOLUTION }}" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            test/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      # Builds Zlib/FreeType/LibAesgm/LibJpeg/LibTiff/LibPng/PDFWriter from
      # source, mirroring the Windows job - see its comment for the full
      # explanation of the _OBJLIB naming and why building "PDFWriter" alone
      # is enough to cascade-build everything else.
      #
      # Patching out the obsolete fdopen() redefinition: two separate
      # vendored copies of zlib's old zutil.h (ZLib's own, and the copy
      # FreeType bundles under src/gzip for reading compressed PCF fonts)
      # contain a decades-old compatibility block - "#if defined(MACOS) ||
      # defined(TARGET_OS_MAC) ... #define fdopen(fd,mode) NULL /* No
      # fdopen() */" - written for classic Mac OS toolchains with no real
      # fdopen(). TARGET_OS_MAC is unconditionally true on every modern
      # Apple platform, so this still fires today, and confirmed directly
      # in CI: the new macOS 26.5 SDK's own <stdio.h> declares fdopen() in
      # a way that collides with our 2-arg function-like macro, producing
      # "error: expected identifier or '('".
      #
      # Two earlier attempts to fix this via CMake variables both failed for
      # CMake-scoping reasons rather than anything wrong with the idea
      # itself: -DCMAKE_C_FLAGS/-DCMAKE_CXX_FLAGS collided with LibPng's own
      # "set(CMAKE_C_FLAGS -DPNG_ARM_NEON_OPT=0 ${CMAKE_C_FLAGS})" (unquoted
      # multi-arg set() = CMake's semicolon-list form, confirmed directly by
      # the compiler's own macro-expansion note showing our flag swallowed
      # into theirs: "#define PNG_ARM_NEON_OPT 0;-Dfdopen=fdopen"). Trying
      # add_compile_definitions() via a -C preload script next seemed like
      # it should sidestep that, but a local empirical test (a minimal
      # add_subdirectory() project, same -C mechanism) confirmed
      # add_compile_definitions() called from a -C script does NOT
      # propagate into add_subdirectory()-included targets - a real CMake
      # scoping limitation, not a variable-name collision this time.
      # Patching the two vendored files directly, in this fresh git clone,
      # sidesteps the entire class of CMake propagation/scoping issue: the
      # broken line simply doesn't exist in what gets compiled, regardless
      # of directory scope, generator, or how any other CMakeLists.txt
      # manipulates its own flags.
      #
      # LibPng/pngpriv.h has the same underlying category of bug, in a
      # different spot: "#if (defined(__MWERKS__) && defined(macintosh)) ||
      # defined(applec) || defined(THINK_C) || defined(__SC__) ||
      # defined(TARGET_OS_MAC) ... #include <fp.h>" - again assuming
      # TARGET_OS_MAC means a classic Mac OS toolchain with a <fp.h> header,
      # which doesn't exist on modern macOS SDKs, confirmed directly in CI:
      # "fatal error: 'fp.h' file not found". Removing TARGET_OS_MAC from
      # that condition is safe: every other macro in the same OR-list
      # (__MWERKS__, applec, THINK_C, __SC__) is equally obsolete and never
      # fires on any build we'd actually run, so the block now falls
      # through to the correct "#include <math.h>" branch unconditionally
      # on real platforms. Checked first that TARGET_OS_MAC appears exactly
      # once in this file, and that no other file in the vendored tree
      # includes <fp.h>, so this is fully contained.
      - name: build PDFWriter static libraries from source
        run: |
          set -euo pipefail
          git clone --branch 4.1 --depth 1 https://github.com/galkahana/PDF-Writer.git pdfwriter-src
          sed -i.bak '/define fdopen(fd,mode) NULL/d' \
            pdfwriter-src/ZLib/zutil.h \
            pdfwriter-src/FreeType/src/gzip/zutil.h
          sed -i.bak 's/ || defined(TARGET_OS_MAC)//' \
            pdfwriter-src/LibPng/pngpriv.h
          rm -f pdfwriter-src/ZLib/zutil.h.bak \
            pdfwriter-src/FreeType/src/gzip/zutil.h.bak \
            pdfwriter-src/LibPng/pngpriv.h.bak

          cmake -G Xcode -S pdfwriter-src -B pdfwriter-build \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build pdfwriter-build --target PDFWriter --config Release


          mkdir -p a
          libs=(Zlib LibAesgm LibJpeg LibTiff FreeType LibPng PDFWriter)
          for lib in "${libs[@]}"; do
            found=$(find pdfwriter-build -name "lib${lib}.a" -print -quit)
            if [ -z "$found" ]; then
              echo "Build did not produce lib${lib}.a - see build output above." >&2
              exit 1
            fi
            cp "$found" "a/lib${lib}_OBJLIB.a"
            echo "Copied $found -> a/lib${lib}_OBJLIB.a"
          done

      # libpng16.a is linked separately from PDF-Writer's own LibPng_OBJLIB
      # in this plugin's .xcodeproj (confirmed in the Frameworks build phase)
      # and its origin is still unresolved - PDF-Writer's own CMake doesn't
      # produce a file by this name. Still fetching it from the "libraries"
      # release until that's tracked down.
      - name: download macOS libpng16.a
        run: |
          set -euo pipefail
          mkdir -p a
          url="https://github.com/miyako/4d-plugin-pdf-text-extraction/releases/download/libraries/libpng16.a"
          echo "Downloading $url"
          curl -fL "$url" -o "a/libpng16.a"

      - name: build macOS plugin (universal)
        run: |
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -target "${{ env.PRODUCT_NAME }}" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BIN="test/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/MacOS/${{ env.PRODUCT_NAME }}"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64" && lipo -info "$BIN" | grep -q "x86_64"

      - name: merge Windows binaries into the bundle
        run: |
          set -euo pipefail
          BUNDLE="test/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          mkdir -p "$BUNDLE/Contents/Windows64"
          cp "winbuild/${{ env.PRODUCT_NAME }}.4DX" "$BUNDLE/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX"
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.zip"
          DMG_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.dmg"

          # zip: cross-platform bundle (win + mac binaries together), what most users grab
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          # dmg: mac-friendly, and the only format Apple lets us staple a ticket to
          hdiutil create -format UDBZ -volname "${{ env.PRODUCT_NAME }}" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
